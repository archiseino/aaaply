name: Autonomous Job Scraper

on:
  schedule:
    # Run at 10:00 WIB every day (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright playwright-stealth
          playwright install chromium

      - name: Random Stealth Delay
        run: |
          # Random delay between 0 and 30 minutes (1800 seconds)
          DELAY=$(( ( RANDOM % 1800 )  + 1 ))
          echo "Stealth mode active: Waiting for $DELAY seconds before starting..."
          sleep $DELAY

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Note: If using user_data for login, you might need to handle session 
          # differently in Cloud, but for now we'll run standard deep scrape.
        run: |
          python scripts/run_scraper.py
